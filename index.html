<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="common.css">
<title>بطاقات الاستذكار — R3D</title>
<style>
  .wrap{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center;}
  .bookline{font-size:12px; color:var(--dim); margin-bottom:2px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="langBox" id="langBox"></div>
    <div class="navrow">
      <a class="navbtn on" href="index.html" data-i18n="nav.index">🏠 الرئيسية</a>
      <a class="navbtn" href="review.html" data-i18n="nav.review">📒 المراجعة</a>
    </div>
    <div class="bookline" id="bookLine"></div>
    <h1 data-i18n="index.title">بطاقات الاستذكار</h1>
    <div class="sub" data-i18n="index.sub">اضغط على الدرس — يعمل بدون إنترنت</div>
  </header>

  <a class="bigrev" href="review.html">
    <span data-i18n="index.reviewBtn">📒 مجموعة المراجعة</span>
    <span class="badge zero" id="revBadge">0</span>
  </a>

  <div class="stats">
    <span class="y" id="mstLine"></span>
  </div>

  <div class="lessons" id="lessonList"></div>

  <div class="tip" data-i18n="index.tip">💡 في سفاري: زر المشاركة ← «إضافة إلى الشاشة الرئيسية»</div>

</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function(){
'use strict';
const D = window.R3D_DATA;
const $ = id => document.getElementById(id);

$('bookLine').textContent = D.books;

function lessonStats(l){
  const marks = R3D.LS.get('r3d-marks-' + l.id, {}) || {};
  const total = D.cards[l.id].length;
  let known = 0;
  Object.keys(marks).forEach(i => { if(marks[i]==='know') known++; });
  const pct = total ? Math.round(known/total*100) : 0;
  const quiz = (R3D.LS.get(R3D.KEY.quiz, {}) || {})[l.id];
  return {total: total, known: known, pct: pct, quiz: quiz};
}

function renderBadges(){
  const rc = R3D.reviewCount();
  const badge = $('revBadge');
  badge.textContent = rc;
  badge.className = 'badge' + (rc === 0 ? ' zero' : '');
  $('mstLine').textContent = R3D.t('index.mastered', {n: R3D.masteredCount()});
}

function renderLessons(){
  const list = $('lessonList');
  list.innerHTML = '';
  D.lessons.forEach((l, n) => {
    const s = lessonStats(l);
    const a = document.createElement('a');
    a.className = 'lesson';
    a.href = l.file;

    const num = document.createElement('div');
    num.className = 'num'; num.textContent = (n+1);

    const info = document.createElement('div');
    info.className = 'info';

    const b = document.createElement('b');
    b.innerHTML = '<span class="cn">' + l.num + '</span> · <span class="cn">' + l.title + '</span>';

    const bar = document.createElement('div');
    bar.className = 'pbar';
    const fill = document.createElement('i');
    fill.style.width = s.pct + '%';
    bar.appendChild(fill);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const p1 = document.createElement('span');
    p1.textContent = R3D.t('index.progress', {p: s.pct});
    const p2 = document.createElement('span');
    p2.textContent = s.quiz
      ? R3D.t('index.quizScore', {s: s.quiz.score, t: s.quiz.total})
      : R3D.t('index.noQuiz');
    meta.appendChild(p1); meta.appendChild(p2);

    info.appendChild(b); info.appendChild(bar); info.appendChild(meta);
    a.appendChild(num); a.appendChild(info);
    list.appendChild(a);
  });
}

R3D.mountLangSelector();
renderBadges();
renderLessons();
window.addEventListener('r3d:lang', () => { renderBadges(); renderLessons(); });
window.addEventListener('r3d:review', renderBadges);
window.addEventListener('r3d:quiz', renderBadges);
})();
</script>
</body>
</html>
