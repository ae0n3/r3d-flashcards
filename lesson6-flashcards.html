<style>
  :root{
    --bg:#0b1220; --bg2:#111a2e; --card:#16213a; --card2:#1d2b4a;
    --line:#26365c; --text:#e8eefc; --muted:#93a4c8; --dim:#5c6f96;
    --accent:#38bdf8; --good:#34d399; --bad:#fb7185; --gold:#fbbf24;
    --cn:'PingFang SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
    --ar:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#0b1220 0%,#0e1830 100%);
    color:var(--text); font-family:var(--ar);
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); overscroll-behavior:none; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  header{width:100%; max-width:520px; text-align:center; margin-bottom:10px;}
  .lesson{font-size:13px; color:var(--muted); margin-bottom:2px;}
  .lesson b{color:var(--accent); font-family:var(--cn); font-size:15px;}
  h1{font-size:19px; margin:4px 0 2px; font-family:var(--cn); font-weight:700;}
  .sub{font-size:12.5px; color:var(--dim);}
  .bar{width:100%; max-width:520px; height:7px; background:#0d1526; border-radius:99px; margin:12px 0 4px; overflow:hidden; border:1px solid var(--line);}
  .bar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--good)); border-radius:99px; transition:width .35s;}
  .stats{font-size:12px; color:var(--muted); display:flex; gap:14px; justify-content:center; margin-bottom:10px;}
  .stats .g{color:var(--good);} .stats .r{color:var(--bad);}
  .chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:520px; margin-bottom:14px;}
  .chip{
    border:1px solid var(--line); background:var(--bg2); color:var(--muted);
    padding:7px 14px; border-radius:99px; font-size:13px; cursor:pointer; font-family:var(--ar);
  }
  .chip.on{background:var(--accent); color:#06283d; border-color:var(--accent); font-weight:700;}
  .stage{width:100%; max-width:520px; flex:0 0 auto;}
  .card{
    position:relative; width:100%; min-height:320px; cursor:pointer;
  }
  .face{
    position:absolute; inset:0;
    background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line); border-radius:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 20px; text-align:center;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.65);
  }
  .face.back{display:none; background:linear-gradient(160deg,#16283a 0%,#1b2f4d 100%);}
  .card.flipped #front{display:none;}
  .card.flipped #back{display:flex;}
  .tag{
    position:absolute; top:12px; font-size:11px; color:var(--dim);
    border:1px solid var(--line); padding:3px 10px; border-radius:99px; background:#0d1526;
  }
  .tag.w{color:var(--accent); border-color:#1e4a66;}
  .tag.s{color:var(--gold); border-color:#4d3f1a;}
  .tag.g{color:var(--good); border-color:#1d4d3f;}
  .big{font-family:var(--cn); font-size:44px; font-weight:700; line-height:1.25; direction:ltr;}
  .hint{position:absolute; bottom:12px; font-size:11.5px; color:var(--dim);}
  .py{font-family:var(--cn); font-size:22px; color:var(--accent); direction:ltr; margin-bottom:8px; font-weight:600;}
  .ar{font-size:17px; line-height:1.7; margin:6px 0; font-weight:600;}
  .type{font-size:12.5px; color:var(--gold); margin-bottom:6px;}
  .ex{
    margin-top:12px; padding:10px 14px; background:#0d1526; border:1px dashed var(--line);
    border-radius:12px; font-size:14.5px; color:var(--muted); line-height:1.7; width:100%;
  }
  .ex .cn{font-family:var(--cn); direction:ltr; display:block; margin-bottom:3px; color:#c8d6f5; font-size:15px;}
  .controls{width:100%; max-width:520px; display:flex; gap:9px; margin-top:16px;}
  .btn{
    flex:1; padding:14px 6px; border-radius:14px; border:1px solid var(--line);
    background:var(--bg2); color:var(--text); font-size:15px; font-family:var(--ar); cursor:pointer;
  }
  .btn:active{transform:scale(.96);}
  .btn.know{background:#0e3b2e; border-color:#1d5c47; color:var(--good); font-weight:700;}
  .btn.know.on{background:var(--good); color:#06281d;}
  .btn.dunno{background:#3d1420; border-color:#6b2233; color:var(--bad); font-weight:700;}
  .btn.dunno.on{background:var(--bad); color:#2b0810;}
  .tools{width:100%; max-width:520px; display:flex; gap:9px; margin-top:10px;}
  .tool{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:transparent;
    color:var(--dim); font-size:12.5px; cursor:pointer; font-family:var(--ar);
  }
  .done{
    display:none; text-align:center; padding:40px 20px; background:var(--card);
    border:1px solid var(--line); border-radius:20px; margin-top:6px;
  }
  .done.show{display:block;}
  .done .big2{font-size:40px; margin-bottom:8px;}
  footer{margin-top:14px; font-size:11.5px; color:var(--dim); text-align:center;}
  .kbd{font-size:10.5px; color:#3d517a;}
  .spk{
    position:absolute; top:12px; left:12px; background:#0d1526; border:1px solid var(--line);
    border-radius:12px; font-size:20px; padding:5px 10px; cursor:pointer; z-index:5;
  }
  .spk:active{transform:scale(.92); background:#12233f;}
  .spkrow{position:absolute; top:10px; left:12px; display:flex; gap:7px; z-index:5;}
  .spk2{
    background:#0d1526; border:1px solid var(--line); color:var(--accent);
    border-radius:10px; font-size:12.5px; padding:5px 11px; cursor:pointer; font-family:var(--ar);
  }
  .spk2:active{transform:scale(.94);}
  .spk2.ex{color:var(--gold); border-color:#4d3f1a;}
</style>
</head>

</div></div>

  <button class="btn" id="prev" data-i18n="btn.prev">‹ السابق</button>

<div class="tools">
  <button class="tool" id="shuffle" data-i18n="tool.shuffle">🔀 خلط</button>

</div>

  <div style="font-size:18px; font-weight:700; margin-bottom:6px;" data-i18n="done.title">أحسنت! خلّصت كل البطاقات</div>
  <div style="color:var(--muted); font-size:14px;" id="doneTxt"></div>

</div>

<footer>

// ================= R3D lesson bootstrap (shared engine) =================
const LESSON_ID = 'l6';
const STORE_KEY = 'r3d-marks-' + LESSON_ID;

// ---- one-time migration from legacy front-keyed marks (l1-marks ...) ----
marks = R3D.Marks.migrate(LESSON_ID, CARDS);
R3D.mountLangSelector();

const $ = id => document.getElementById(id);
const card = $('card');

const CATS = [
  {k:'all',  key:'cat.all'},
  {k:'word', key:'cat.word'},
  {k:'sent', key:'cat.sent'},
  {k:'gram', key:'cat.gram'},
];
const CATKEY = {word:'tag.word', sent:'tag.sent', gram:'tag.gram'};

let filter = 'all';
let order = [];
let idx = 0;
let flipped = false;

function save(){ R3D.Marks.save(LESSON_ID, marks); }

function view(){
  return order
    .map(i => ({ c: CARDS[i], i: i }))
    .filter(x => filter==='all' || x.c.cat===filter);
}

function shuffle(){
  order = CARDS.map((c,i)=>i);
  R3D.shuffleArr(order);
}

function renderChips(){
  const el = $('chips'); el.innerHTML = '';
  CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat.k===filter ? ' on' : '');
    b.textContent = R3D.t(cat.key);
    b.onclick = () => { filter = cat.k; idx = 0; renderChips(); render(); };
    el.appendChild(b);
  });
}

function render(){
  const V = view();
  if(!V.length){ return; }
  idx = Math.max(0, Math.min(idx, V.length-1));
  const c = V[idx].c, oi = V[idx].i;
  flipped = false;
  card.classList.remove('flipped');
  $('big').textContent = c.front;
  const t1 = $('tagf');
  t1.textContent = R3D.t(CATKEY[c.cat] || 'tag.word');
  t1.className = 'tag ' + c.cat.charAt(0);

  let html = '';
  if(c.cat === 'word'){
    html += '<div class="py">'+c.py+'</div>';
    html += '<div class="ar">'+gloss(c)+'</div>';
    if(c.type) html += '<div class="type">'+cardType(c)+'</div>';
    if(c.ex) html += '<div class="ex"><span class="cn">'+c.ex+'</span>'+R3D.t('tag.sent')+'</div>';
  } else {
    if(c.sub) html += '<div class="type">'+cardSub(c)+'</div>';
    html += '<div class="py">'+(c.py||'')+'</div>';
    html += '<div class="ar" style="text-align:right;">'+gloss(c)+'</div>';
  }
  $('backBody').innerHTML = html;
  const tb = $('tagb');
  tb.textContent = R3D.t(CATKEY[c.cat] || '');
  tb.className = 'tag ' + c.cat.charAt(0);

  // audio buttons
  $('spkf').onclick = function(e){ e.stopPropagation(); R3D.play(c.au); };
  const row = $('spkrow'); row.innerHTML = '';
  if (c.au) {
    const b1 = document.createElement('button');
    b1.className = 'spk2'; b1.textContent = '🔊 ' + R3D.t('btn.listen');
    b1.onclick = function(e){ e.stopPropagation(); R3D.play(c.au); };
    row.appendChild(b1);
  }
  if (c.ax) {
    const b2 = document.createElement('button');
    b2.className = 'spk2 ex'; b2.textContent = '🔊 ' + R3D.t('btn.example');
    b2.onclick = function(e){ e.stopPropagation(); R3D.play(c.ax); };
    row.appendChild(b2);
  }

  // buttons state
  $('know').classList.toggle('on', marks[oi]==='know');
  $('dunno').classList.toggle('on', marks[oi]==='dunno');
  $('cnt').textContent = (idx+1)+'/'+V.length;
  updateStats();
  updateDone();
}

function updateStats(){
  let k=0, d=0;
  CARDS.forEach((c,i)=>{ if(marks[i]==='know') k++; else if(marks[i]==='dunno') d++; });
  $('k').textContent = k; $('d').textContent = d;
  $('bar').style.width = Math.round(k/CARDS.length*100)+'%';
  $('doneTxt').textContent = R3D.t('stats.know')+': '+k+' · '+R3D.t('stats.review')+': '+d;
}

function updateDone(){
  const V = view();
  const atEnd = V.length && idx >= V.length-1;
  $('done').classList.toggle('show', !!atEnd);
}

function flip(){ flipped = !flipped; card.classList.toggle('flipped', flipped); }

function next(){
  const V = view();
  if(idx < V.length-1){ idx++; render(); }
  else { unlockQuiz(); }
}
function prev(){ if(idx > 0){ idx--; render(); } }

function unlockQuiz(){
  const meta = R3D.LS.get(R3D.KEY.meta, {}) || {};
  if(meta['quiz-'+LESSON_ID]) return;
  meta['quiz-'+LESSON_ID] = true;
  R3D.LS.set(R3D.KEY.meta, meta);
  $('quizTool').style.display = '';
  updateDone();
}

function mark(v){
  const V = view(); if(!V.length) return;
  const oi = V[idx].i;
  const key = LESSON_ID + ':' + oi;
  const st = R3D.reviewGet(key);

  if(v === 'dunno'){
    // "I don't know it" is always a wrong answer: mastered -> back to review.
    marks[oi] = 'dunno'; save();
    R3D.answerWrong(key);
    render();
    setTimeout(next, 260);
    return;
  }

  // v === 'know'
  if(marks[oi] === 'know'){ delete marks[oi]; save(); render(); return; }  // legacy toggle-off
  marks[oi] = 'know'; save();
  if(st.s === 'review') R3D.answerCorrect(key);   // counts only inside the review cycle
  render();
  setTimeout(next, 260);
}

card.addEventListener('click', flip);
$('next').addEventListener('click', next);
$('prev').addEventListener('click', prev);
$('know').addEventListener('click', e=>{ e.stopPropagation(); mark('know'); });
$('dunno').addEventListener('click', e=>{ e.stopPropagation(); mark('dunno'); });
$('shuffle').addEventListener('click', ()=>{ shuffle(); idx=0; render(); });
$('reset').addEventListener('click', ()=>{
  if(confirm(R3D.t('confirm.reset'))){
    R3D.Marks.resetLesson(LESSON_ID, CARDS.length);
    marks = {};
    $('quizTool').style.display = 'none';
    shuffle(); idx=0; render();
  }
});
$('quizTool').addEventListener('click', ()=> R3D.Quiz.start($('quizSec'), LESSON_ID));
$('quizBtn').addEventListener('click', ()=> R3D.Quiz.start($('quizSec'), LESSON_ID));

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') prev();
  else if(e.key==='ArrowRight') next();
  else if(e.key===' '){ e.preventDefault(); flip(); }
  else if(e.key==='k'||e.key==='K') mark('know');
  else if(e.key==='j'||e.key==='J') mark('dunno');
});

window.addEventListener('r3d:lang', ()=>{ renderChips(); render(); });

shuffle();
renderChips();
render();

// restore quiz unlock state
const meta0 = R3D.LS.get(R3D.KEY.meta, {}) || {};
if(meta0['quiz-'+LESSON_ID]) $('quizTool').style.display = '';

// prime audio on first gesture (iOS rule)
document.addEventListener('pointerdown', ()=> R3D.primeAudio((CARDS.find(c=>c.au)||{}).au || ''), {once:true, passive:true});
</script>
</body>
</html>
